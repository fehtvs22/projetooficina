name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-e-testes:
    name: Build, testes e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Testes unitários, de integração e de arquitetura + verificação de cobertura (>= 80%)
        run: ./mvnw -B verify

      - name: Publicar relatório de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cobertura
          path: target/site/jacoco

  seguranca:
    name: Análise de vulnerabilidades (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy - dependências, segredos e Dockerfile
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  imagem:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: build-e-testes
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t projetooficina-app:ci .
      - name: Trivy - imagem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: projetooficina-app:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
