# Atrás do Caddy (HTTPS), preserva o esquema original; acessado direto, usa o do próprio Nginx
map $http_x_forwarded_proto $esquema_original {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Resolve "app" pelo DNS do Docker a cada 10 s: o Nginx sobe mesmo com a API fora do ar
    # e acompanha a troca de IP quando o container da API é recriado.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Mesma origem para a API: dispensa CORS e não expõe a porta do back-end
    location /api/ {
        set $api http://app:8080;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_original;
    }

    # Documentação da API (Swagger UI e OpenAPI JSON) servida pelo back-end
    location ~ ^/(swagger-ui\.html|swagger-ui/|v3/api-docs) {
        set $api http://app:8080;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_original;
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # Arquivos com hash no nome podem ficar em cache para sempre
    location /assets/ {
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fallback do SPA: rotas do React Router devolvem o index.html (sem cache)
    location / {
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
