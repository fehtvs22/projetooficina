services:
  postgres:
    image: postgres:17-alpine
    container_name: oficina-postgres
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: ${DB_USERNAME:?defina DB_USERNAME no arquivo .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
    ports:
      - "${DB_PORTA_HOST:-5432}:5432"
    volumes:
      - oficina-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d oficina"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: oficina-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/oficina
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      JWT_EXPIRACAO_MINUTOS: ${JWT_EXPIRACAO_MINUTOS:-60}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no arquivo .env}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: oficina-frontend
    depends_on:
      - app
    ports:
      - "${FRONTEND_PORTA_HOST:-3000}:8080"

volumes:
  oficina-dados:
